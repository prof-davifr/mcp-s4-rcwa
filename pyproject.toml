[project]
name = "mcp-s4-rcwa"
version = "0.1.0"
description = "MCP server for S4-style Rigorous Coupled Wave Analysis (RCWA) simulations of layered/periodic photonic structures"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "matplotlib>=3.5",
    "numpy>=1.23",
]

[project.scripts]
mcp-s4-rcwa = "mcp_s4_rcwa.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_s4_rcwa"]

[tool.hatch.build.targets.wheel.force-include]
"src/mcp_s4_rcwa/s4lib/libS4.so" = "mcp_s4_rcwa/s4lib/libS4.so"
